; Magic Wand & Broomstick - settings
; Key names: A-Z, F1-F12, PageUp, PageDown, Home, End, Insert, Delete, None
; (or a raw DirectInput scan code number)

[Wand]
; Weapon slot used as the wand. 7 = Pistol (Glock). Other ids: 9 = Desert Eagle.
WeaponId=7
; Look at something with the wand out and press this to lift / drop it
GrabKey=E
; While levitating: move the object closer / further away
PullCloserKey=PageDown
PushAwayKey=PageUp
; Shooting while levitating something throws it
ThrowForce=45
GrabRange=60
; Magic blast when you shoot a person
BlastRange=120
BlastMinDistance=5
BlastForce=40
; GTA IV explosion type id (3 = car explosion, 0 = grenade, 1 = molotov)
BlastExplosionType=3
BlastRadius=1.5
BlastCooldownMs=350

[Broomstick]
; Dial this on Niko's phone. 2766786255 = B-R-O-O-M-S-T-I-C-K on the keypad.
PhoneNumber=2766786255
; Vehicle model used for the broomstick (re-skin it for a real broom look)
Model=NRG900
; Top speed in metres per second (75 = ~270 km/h). Hold the normal
; accelerate control (W / right trigger) to reach it.
MaxSpeed=75
Acceleration=30
WarpIntoBroom=true
; Optional keyboard shortcut to summon the broom without the phone (None = off)
SummonHotkey=None
